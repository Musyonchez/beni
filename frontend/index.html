<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peer Tutoring & Study Group Matcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Peer Tutoring & Study Group Matcher</h1>
    <div id="userBox" class="user-box"></div>
  </header>

  <main id="app">
    <!-- Auth screen -->
    <section id="authView" class="view">
      <div class="auth-forms">
        <form id="loginForm" class="card">
          <h2>Log in</h2>
          <label>Email <input type="email" name="email" required /></label>
          <label>Password <input type="password" name="password" required /></label>
          <button type="submit">Log in</button>
          <p class="form-msg" data-for="login"></p>
        </form>

        <form id="registerForm" class="card">
          <h2>Register</h2>
          <label>Name <input type="text" name="name" required /></label>
          <label>Email <input type="email" name="email" required /></label>
          <label>Password <input type="password" name="password" minlength="6" required /></label>
          <button type="submit">Create account</button>
          <p class="hint">First account created becomes the admin.</p>
          <p class="form-msg" data-for="register"></p>
        </form>
      </div>
    </section>

    <!-- Main app (visible once logged in) -->
    <section id="dashboardView" class="view hidden">
      <nav class="tabs">
        <button class="tab-btn active" data-tab="find">Find a Tutor</button>
        <button class="tab-btn" data-tab="tutor">Become a Tutor</button>
        <button class="tab-btn" data-tab="requests">Request Help</button>
        <button class="tab-btn" data-tab="sessions">My Sessions</button>
        <button class="tab-btn" data-tab="admin" id="adminTabBtn" hidden>Admin</button>
      </nav>

      <!-- Find a tutor -->
      <section id="tab-find" class="tab-panel">
        <div class="card">
          <h2>Find a Tutor</h2>
          <label>Course
            <select id="findCourseSelect"></select>
          </label>
          <button id="findTutorsBtn">Search</button>
        </div>
        <div id="tutorResults" class="list"></div>
      </section>

      <!-- Become a tutor -->
      <section id="tab-tutor" class="tab-panel hidden">
        <form id="tutorForm" class="card">
          <h2>Register as a Tutor</h2>
          <label>Course
            <select name="courseId" id="tutorCourseSelect"></select>
          </label>
          <label>Bio <textarea name="bio" placeholder="e.g. Scored an A, happy to help with recursion and sorting"></textarea></label>
          <label>Availability <input type="text" name="availability" placeholder="e.g. Mon/Wed 5-7pm" required /></label>
          <button type="submit">Save Tutor Profile</button>
          <p class="form-msg" data-for="tutor"></p>
        </form>
        <div id="myTutorProfiles" class="list">
          <h3>My Tutor Profiles</h3>
          <div id="myTutorProfilesList"></div>
        </div>
      </section>

      <!-- Request help -->
      <section id="tab-requests" class="tab-panel hidden">
        <form id="requestForm" class="card">
          <h2>Request Help</h2>
          <label>Course
            <select name="courseId" id="requestCourseSelect"></select>
          </label>
          <label>Topic <input type="text" name="topic" placeholder="e.g. Big-O notation" required /></label>
          <label>Preferred times <input type="text" name="preferredTimes" placeholder="e.g. Weekday evenings" /></label>
          <button type="submit">Submit Request</button>
          <p class="form-msg" data-for="request"></p>
        </form>
        <div id="myRequests" class="list">
          <h3>My Requests</h3>
          <div id="myRequestsList"></div>
        </div>
      </section>

      <!-- Sessions -->
      <section id="tab-sessions" class="tab-panel hidden">
        <h2>My Sessions</h2>
        <div id="sessionsList" class="list"></div>
      </section>

      <!-- Admin -->
      <section id="tab-admin" class="tab-panel hidden">
        <h2>Admin</h2>
        <div id="adminStats" class="stats"></div>
        <h3>Tutor Profiles</h3>
        <div id="adminTutorsList" class="list"></div>
      </section>
    </section>
  </main>

  <template id="tutorCardTemplate">
    <div class="card tutor-card">
      <h4 class="t-name"></h4>
      <p class="t-course"></p>
      <p class="t-bio"></p>
      <p class="t-availability"></p>
      <p class="t-rating"></p>
      <div class="book-row">
        <input type="datetime-local" class="t-book-time" />
        <button class="t-book-btn">Book Session</button>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
